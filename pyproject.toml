[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spacement-pvextent"
version = "1.0.0"
description = "CAD-grade photovoltaic array segmentation, 3D solar yield modeling and 4D temporal asset tracking from aerial orthophotos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=13,<14"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Valeford" }]
maintainers = [{ name = "Valeford" }]
keywords = ["photovoltaics", "segmentation", "orthophotos", "remote-sensing", "cad", "solar", "3d-elevation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
import = ["h5py>=3.12,<4", "numpy>=2,<3"]
geo = ["pyproj>=3.7,<4"]
train = ["torch>=2.8,<3"]
baseline = ["torch>=2.8,<3", "torchvision>=0.23,<1", "segmentation-models-pytorch>=0.5,<1", "safetensors>=0.5,<1"]

[project.urls]
Repository = "https://github.com/valeford-de/spacement-pvextent"
Issues = "https://github.com/valeford-de/spacement-pvextent/issues"

[project.scripts]
pvextent = "pvextent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pvextent.data" = ["licenses/*.txt"]
